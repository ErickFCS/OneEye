<div [class]="'rating rating-half rating-xl ' + classString()">
  <div
    class="mask mask-star-2 mask-half-1 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 1"
  ></div>
  <div
    class="mask mask-star-2 mask-half-2 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 2"
  ></div>
  <div
    class="mask mask-star-2 mask-half-1 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 3"

  <div

    aria-label="2 star"

  <div
    class="mask mask-star-2 mask-half-1 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 5"
  ></div>
  <div
    class="mask mask-star-2 mask-half-2 bg-orange-400"
    aria-label="3 star"
    [aria-current]="stars() >= 6"
  ></div>
  <div
    class="mask mask-star-2 mask-half-1 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 7"
  ></div>
  <div
    class="mask mask-star-2 mask-half-2 bg-orange-400"
    aria-label="4 star"
    [aria-current]="stars() >= 8"
  ></div>
  <div
    class="mask mask-star-2 mask-half-1 bg-orange-400"
    aria-label="1 star"
    [aria-current]="stars() >= 9"
  ></div>
  <div
    class="mask mask-star-2 mask-half-2 bg-orange-400"
    aria-label="5 star"
    [aria-current]="stars() >= 10"
  ></div>
</div>
