<label class="swap swap-rotate [filter:url(#solid-outline)]">
  <input type="checkbox" class="theme-controller" value="light" />

  <svg class="swap-on size-10 fill-current [filter:url(#filter-outline)]">
    <use href="#icon-sun"></use>
  </svg>

  <svg class="swap-off size-10 fill-current [filter:url(#filter-outline)]">
    <use href="#icon-moon"></use>
  </svg>
</label>
